# Configuración de análisis estático para SonarQube Community Build
# Uso: scripts\sonar.ps1 scan
# Docs: https://docs.sonarsource.com/sonarqube-community-build/analyzing-source-code/

sonar.projectKey=bass-karaoke
sonar.projectName=Bass Karaoke
sonar.projectVersion=3.0.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

sonar.sources=bass_karaoke,launcher.py,bass_karaoke_v3.py
sonar.tests=tests

# Cobertura generada por pytest-cov (scripts\sonar.ps1 scan la regenera)
sonar.python.coverage.reportPaths=coverage.xml

# Ruido: código de terceros, artefactos de build, datos de usuario
sonar.exclusions=\
  **/build/**,\
  **/dist/**,\
  **/console_dist/**,\
  **/build_console/**,\
  **/vendor/**,\
  **/JJazzLab-Jazz-1460/**,\
  **/songs/**,\
  **/models/**,\
  **/openbook_musicxml/**,\
  **/.venv/**,\
  **/__pycache__/**

# La duplicación en tablas de acordes/constantes es intencional
sonar.cpd.exclusions=bass_karaoke/scales.py,bass_karaoke/chords.py

sonar.host.url=http://localhost:9000
